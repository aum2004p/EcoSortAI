{% extends 'base.html' %}

{% block title %}เข้าสู่ระบบ - EcoSort AI{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h1>🔐 เข้าสู่ระบบ</h1>
            <p>เข้าสู่ระบบเพื่อสะสมคะแนนและเข้าร่วมอันดับรีไซเคิล</p>
        </div>
        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="username">ชื่อผู้ใช้</label>
                <input type="text" id="username" name="username" required
                       placeholder="กรอกชื่อผู้ใช้">
            </div>
            <div class="form-group">
                <label for="password">รหัสผ่าน</label>
                <input type="password" id="password" name="password" required
                       placeholder="กรอกรหัสผ่าน">
            </div>
            <div id="loginError" class="auth-error hidden"></div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">
                เข้าสู่ระบบ
            </button>
        </form>
        <div class="auth-footer">
            <p>ยังไม่มีบัญชี? <a href="{{ url_for('register_page') }}">สมัครสมาชิก</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorDiv = document.getElementById('loginError');
    errorDiv.classList.add('hidden');

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password}),
        });
        const data = await res.json();
        if (data.success) {
            window.location.href = '/profile';
        } else {
            errorDiv.textContent = data.error || 'เข้าสู่ระบบไม่สำเร็จ';
            errorDiv.classList.remove('hidden');
        }
    } catch (err) {
        errorDiv.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
        errorDiv.classList.remove('hidden');
    }
});
</script>
{% endblock %}
